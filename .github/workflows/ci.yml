name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    env:
      # Unit tests need no credentials. Integration tests run only when the
      # repository has Turso secrets configured (Settings > Secrets > Actions).
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r services/ai-backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check services/ai-backend/app services/ai-backend/tests
      - name: Unit tests (no external services required)
        run: cd services/ai-backend && python -m pytest tests/test_orchestrator.py -q -p no:cacheprovider
      - name: Integration tests (requires Turso secrets)
        if: ${{ env.TURSO_DATABASE_URL != '' }}
        run: cd services/ai-backend && python -m pytest tests/test_api.py -q -p no:cacheprovider
      - name: Integration tests skipped (no Turso secrets)
        if: ${{ env.TURSO_DATABASE_URL == '' }}
        run: echo "TURSO_DATABASE_URL secret not set — integration tests skipped (documented in docs/testing.md)."

  web:
    name: Web (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: cd apps/web && bunx tsc --noEmit
      - name: Lint
        run: cd apps/web && bun run lint
      - name: Production build
        run: cd apps/web && bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  bridge:
    name: AI bridge (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: cd services/ai-bridge && bun install --frozen-lockfile || bun install
      - name: Typecheck
        run: cd services/ai-bridge && bunx tsc --noEmit
